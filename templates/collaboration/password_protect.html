{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Required</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background: #FAFAFA; display: flex; justify-content: center; align-items: center; height: 100vh;">
    <div style="background: #FFF; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 100%; max-width: 400px; text-align: center;">
        <h4 style="margin-bottom: 24px; font-weight: 600;">Password Required</h4>
        <form method="post">
            {% csrf_token %}
            <input type="password" name="password" class="form-control mb-3" placeholder="Enter password" required>
            <button type="submit" class="btn btn-dark w-100">Access Presentation</button>
        </form>
        {% if messages %}
            {% for message in messages %}
                <div class="text-danger mt-3" style="font-size: 0.85rem;">{{ message }}</div>
            {% endfor %}
        {% endif %}
    </div>
</body>
</html>
